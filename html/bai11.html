<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Fruit Store</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../js/fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.min.css">
    <script src="../js/jquery-3.7.1.js"></script>
    <script src="../js/bootstrap.bundle.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<section class="page-hero">
    <div class="container">
        <h2><i class="fa-solid fa-bag-shopping me-2 text-success"></i>Giỏ hàng của bạn</h2>
    </div>
</section>

<div class="container my-4">
    <div class="row g-4">
        <!-- Cart items -->
        <div class="col-lg-8">
            <div class="cart-table-wrap">
                <table class="table" id="cart">
                    <thead>
                        <tr>
                            <th style="width:50px;"></th>
                            <th>Sản phẩm</th>
                            <th style="width:160px;">Số lượng</th>
                            <th style="width:120px;" class="text-end">Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody id="cartTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
            <div class="order-summary-card">
                <h5><i class="fa-solid fa-receipt me-2 text-success"></i>Tóm tắt đơn hàng</h5>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-muted">Tổng sản phẩm:</span>
                    <span id="item-count" class="fw-medium">0 sản phẩm</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold">Tổng tiền:</span>
                    <span class="order-total" id="total-price">0</span>
                </div>
                <div id="total-display" class="text-end mb-3" style="font-size:0.85rem; color:#666;">= <span id="total-price-unit">0</span> đ</div>
                <button class="btn-checkout mb-2" onclick="saveDataAndGoToCheckout()">
                    <i class="fa-solid fa-credit-card me-1"></i> Tiến hành thanh toán
                </button>
                <button class="btn-continue" onclick="window.location.href='bai5ghep.html'">
                    <i class="fa-solid fa-arrow-left me-1"></i> Tiếp tục mua sắm
                </button>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="../js/layout.js"></script>
<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderCart() {
        const cartTable = document.getElementById('cartTable');
        cartTable.innerHTML = '';
        let total = 0;
        let itemCount = 0;

        if (cart.length === 0) {
            cartTable.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-5">
                        <i class="fa-solid fa-bag-shopping text-muted" style="font-size:3rem; opacity:0.3;"></i>
                        <p class="mt-3 text-muted">Giỏ hàng trống</p>
                        <a href="bai5ghep.html" class="btn btn-success btn-sm px-4">
                            <i class="fa-solid fa-store me-1"></i> Đi mua sắm ngay
                        </a>
                    </td>
                </tr>`;
        } else {
            cart.forEach((item, index) => {
                const price = parseInt(item.price.replace(/\D/g, ''));
                const rowTotal = price * item.quantity;
                total += rowTotal;
                itemCount += item.quantity;

                const row = document.createElement('tr');
                row.setAttribute('data-unit-price', price);
                row.innerHTML = `
                    <td>
                        <button class="delete-btn" onclick="removeItem(${index})">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                    <td>
                        <div class="fw-medium">${item.name}</div>
                        <small class="text-muted">${price.toLocaleString('vi-VN')} đ / cái</small>
                    </td>
                    <td>
                        <div class="input-group" style="max-width:130px;">
                            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="decreaseQuantity(${index})">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <input type="text" class="form-control quantity-input text-center fw-bold" value="${item.quantity}" readonly>
                            <button class="btn btn-outline-secondary btn-sm" type="button" onclick="increaseQuantity(${index})">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </td>
                    <td class="text-end fw-semibold text-danger">
                        <span class="row-total">${rowTotal.toLocaleString('vi-VN')}</span> đ
                    </td>
                `;
                cartTable.appendChild(row);
            });
        }

        const totalEl = document.getElementById('total-price');
        const totalUnit = document.getElementById('total-price-unit');
        const itemCountEl = document.getElementById('item-count');
        if (totalEl) totalEl.textContent = total.toLocaleString('vi-VN');
        if (totalUnit) totalUnit.textContent = total.toLocaleString('vi-VN');
        if (itemCountEl) itemCountEl.textContent = itemCount + ' sản phẩm';
    }

    function increaseQuantity(index) {
        cart[index].quantity++;
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    function decreaseQuantity(index) {
        if (cart[index].quantity > 1) {
            cart[index].quantity--;
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
    }

    function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    function saveDataAndGoToCheckout() {
        if (cart.length === 0) {
            alert('Giỏ hàng trống! Vui lòng thêm sản phẩm trước.');
            return;
        }
        localStorage.setItem('checkoutCart', JSON.stringify(cart));
        const totalAmount = cart.reduce((sum, item) => {
            const price = parseInt(item.price.replace(/\D/g, ''));
            return sum + price * item.quantity;
        }, 0);
        localStorage.setItem('totalAmount', totalAmount);
        window.location.href = 'thanhtoan.html';
    }

    renderCart();
</script>
</body>
</html>
