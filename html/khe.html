<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khế Ngọt - Fruit Store</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../js/fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.min.css">
    <script src="../js/jquery-3.7.1.js"></script>
    <script src="../js/bootstrap.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<section class="page-hero">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0" style="font-size:0.9rem;">
                <li class="breadcrumb-item"><a href="bai5ghep.html" class="text-success text-decoration-none"><i class="fa-solid fa-house me-1"></i>Trang chủ</a></li>
                <li class="breadcrumb-item active fw-medium">Khế Ngọt</li>
            </ol>
        </nav>
    </div>
</section>

<div class="container mb-5">
    <div class="product-detail-wrap">
        <div class="row g-4 align-items-start">
            <div class="col-md-5">
                <div class="product-img-wrap">
                    <img src="../images/khe.png" alt="Khế Ngọt" id="productImage">
                </div>
            </div>
            <div class="col-md-7">
                <h2 id="productName">Khế Ngọt</h2>
                <div class="product-info">
                    <div class="info-item"><strong>Xuất xứ:</strong> Việt Nam</div>
                    <div class="info-item"><strong>Tiêu chuẩn:</strong> Trái cây sạch</div>
                    <div class="info-item"><strong>Trọng lượng:</strong> 1KG/Túi</div>
                    <div class="info-item"><strong>Đặc điểm:</strong>
                        <span>Trái to, vàng óng, vị ngọt thanh. Giàu vitamin C, có thể ăn trực tiếp hoặc làm nước ép.</span>
                    </div>
                </div>

                <div class="price-tag">
                    <span>Giá:</span>
                    <span id="productPrice" class="ms-2">12.000 ₫</span>
                    <small class="text-muted ms-1" style="font-size:0.75rem;">/kg</small>
                </div>

                <div class="d-flex align-items-center gap-3 my-3">
                    <label class="form-label mb-0 fw-medium">Số lượng:</label>
                    <input type="number" id="soluong" value="1" min="1" class="form-control" style="width:80px; text-align:center; font-weight:600;">
                </div>

                <button type="button" id="addToCart" class="btn-add-cart">
                    <i class="fa-solid fa-cart-shopping"></i> THÊM VÀO GIỎ HÀNG
                </button>

                <div class="mt-3">
                    <a href="bai5ghep.html" class="text-success text-decoration-none" style="font-size:0.9rem;">
                        <i class="fa-solid fa-arrow-left me-1"></i>Tiếp tục mua sắm
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="../js/layout.js"></script>
<script>
    document.getElementById('addToCart').addEventListener('click', function () {
        const productName = document.getElementById('productName').textContent;
        const productPrice = document.getElementById('productPrice').textContent;
        const productQuantity = parseInt(document.getElementById('soluong').value);
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existingProduct = cart.find(item => item.name === productName);
        if (existingProduct) {
            existingProduct.quantity += productQuantity;
        } else {
            cart.push({ name: productName, price: productPrice, quantity: productQuantity });
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        window.location.href = 'bai11.html';
    });
</script>
</body>
</html>
