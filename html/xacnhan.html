<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Đơn Hàng - Fruit Store</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../js/fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.min.css">
    <script src="../js/jquery-3.7.1.js"></script>
    <script src="../js/bootstrap.js"></script>
</head>
<body>

<div id="header-placeholder"></div>

<section class="page-hero">
    <div class="container">
        <h2><i class="fa-solid fa-clipboard-check me-2 text-success"></i>Xác nhận đơn hàng</h2>
    </div>
</section>

<div class="container my-4">

    <!-- Success Banner -->
    <div class="alert" style="background: linear-gradient(135deg, #d1e7dd, #a3cfbb); border:none; border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1.5rem;">
        <div class="d-flex align-items-center gap-3">
            <i class="fa-solid fa-circle-check text-success" style="font-size:2rem;"></i>
            <div>
                <div class="fw-bold text-success" style="font-size:1.1rem;">Đơn hàng đã được ghi nhận!</div>
                <div style="font-size:0.9rem; color:#0f5132;">Vui lòng kiểm tra và xác nhận thông tin bên dưới.</div>
            </div>
        </div>
    </div>

    <!-- Customer Info -->
    <div class="confirm-section">
        <h5><i class="fa-solid fa-user me-2"></i>Thông Tin Khách Hàng</h5>
        <div class="table-responsive">
            <table class="table table-bordered table-modern mb-0">
                <thead>
                    <tr>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Ghi chú</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="displayName">N/A</td>
                        <td id="displayEmail">N/A</td>
                        <td id="displayPhone">N/A</td>
                        <td id="displayAddress">N/A</td>
                        <td id="displayNote">N/A</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Cart Info -->
    <div class="confirm-section">
        <h5><i class="fa-solid fa-basket-shopping me-2"></i>Thông Tin Giỏ Hàng</h5>
        <div class="table-responsive">
            <table class="table table-bordered table-modern mb-0">
                <thead>
                    <tr>
                        <th>Tên sản phẩm</th>
                        <th class="text-center">Đơn giá</th>
                        <th class="text-center">Số lượng</th>
                        <th class="text-end">Thành tiền</th>
                    </tr>
                </thead>
                <tbody id="productDetailsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Total -->
    <div class="text-end mb-4">
        <span class="fw-bold fs-4">Tổng tiền: </span>
        <span class="fw-bold fs-4 text-danger" id="totalAmount">0 đ</span>
    </div>

    <!-- Actions -->
    <div class="d-flex gap-3 justify-content-between">
        <button class="btn btn-outline-secondary px-4" onclick="window.location.href='thanhtoan.html'">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </button>
        <button class="btn btn-success px-5 fw-semibold" onclick="confirmOrder()">
            <i class="fa-solid fa-check me-1"></i> Xác nhận đặt hàng
        </button>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="../js/layout.js"></script>
<script>
    // Display customer info
    document.getElementById('displayName').textContent    = localStorage.getItem('userName')    || 'N/A';
    document.getElementById('displayEmail').textContent   = localStorage.getItem('userEmail')   || 'N/A';
    document.getElementById('displayPhone').textContent   = localStorage.getItem('userPhone')   || 'N/A';
    document.getElementById('displayAddress').textContent = localStorage.getItem('userAddress') || 'N/A';
    document.getElementById('displayNote').textContent    = localStorage.getItem('userNote')    || '(không có)';

    // Display cart
    const checkoutCart = JSON.parse(localStorage.getItem('checkoutCart')) || [];
    const totalAmount  = parseInt(localStorage.getItem('totalAmount')) || 0;
    const tbody = document.getElementById('productDetailsTable');

    if (checkoutCart.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Không có sản phẩm</td></tr>';
    } else {
        checkoutCart.forEach(item => {
            const price = parseInt(item.price.replace(/\D/g, ''));
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.name}</td>
                <td class="text-center">${price.toLocaleString('vi-VN')} đ</td>
                <td class="text-center">${item.quantity}</td>
                <td class="text-end fw-medium text-danger">${(price * item.quantity).toLocaleString('vi-VN')} đ</td>
            `;
            tbody.appendChild(row);
        });
    }

    document.getElementById('totalAmount').textContent = totalAmount.toLocaleString('vi-VN') + ' đ';

    function confirmOrder() {
        // Clear cart after order confirmed
        localStorage.removeItem('cart');
        localStorage.removeItem('checkoutCart');
        localStorage.removeItem('totalAmount');
        alert('Đặt hàng thành công! Chúng tôi sẽ liên hệ với bạn sớm nhất. Xin cảm ơn!');
        window.location.href = 'bai5ghep.html';
    }
</script>
</body>
</html>
